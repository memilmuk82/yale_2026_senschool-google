<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>예일여고 교원 연수 · 강사 노트</title>
  <style>
    body{margin:0;background:#f5f2ff;color:#251e41;font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif}
    header{position:sticky;top:0;padding:20px 5vw;background:#fff;border-bottom:1px solid #ddd5f7;z-index:2}h1{margin:0;font-size:27px}

    table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:10px 12px;border:1px solid #e2dcf4;text-align:left}th{background:#ebe6ff}

  </style>
</head>
<body>
  <header><h1>센스쿨 × 구글 클래스룸(구글 에듀케이션 플러스) · 강사 노트</h1></header>
  <section class="timing"><h2>운영 시간표</h2><p>14:00–14:15 접속 · 14:15–14:30 센스쿨 · 14:30–14:45 플러스 · 14:45–14:55 학교 맥락과 시연 · 14:55–15:00 센지피티 준비 · 15:00–15:50 생성·수정·역할·재사용 · 15:50–16:00 공유</p></section>

  <script src="./slides/slides.js?v=20261005-links"></script>
  <script>document.querySelector('#notes').innerHTML=window.DECK.map((item,i)=>`<section class="item"><h2>${String(i+1).padStart(2,'0')} ${item.title}</h2><p>${item.notes}</p><a href="./slides/index.html#slide=${i+1}">슬라이드 열기 ↗</a></section>`).join('');</script>
</body>
</html>
